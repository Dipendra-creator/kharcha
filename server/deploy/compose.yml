# Production stack: API + its own Postgres (no host port; only the API is published).
#   cp deploy/.env.example deploy/.env   # then fill in secrets
#   docker compose -f deploy/compose.yml up -d --build
name: kharcha
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kharcha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: kharcha
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kharcha"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ..
    env_file: .env
    environment:
      DATABASE_URL: postgres://kharcha:${POSTGRES_PASSWORD}@db:5432/kharcha?sslmode=disable
      KHARCHA_ADDR: ":8080"
    ports: ["${KHARCHA_PORT:-8090}:8080"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
